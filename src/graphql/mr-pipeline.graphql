fragment PipelineField on Pipeline {
  active
  iid
  stages {
    __typename
    nodes {
      id
      name
      jobs {
        nodes {
          id
          webPath
          name
          status
          failureMessage
          startedAt
          duration
          finishedAt
          active
          allowFailure
        }
      }
      status
    }
  }
}

query MRPipeline($projectPath: ID!, $iid: String!) {
  project(fullPath: $projectPath) {
    mergeRequest(iid: $iid) {
      id
      iid
      state
      headPipeline {

        ...PipelineField
      }
    }
  }
}
